<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="C.H.A.T. — private conversational Scripture reflection. Content, Heart, Application, Testimony."
    />
    <title>C.H.A.T.</title>
    <!--
      The chosen theme, before the first pixel.

      This runs ahead of the stylesheet and the application, so a person who
      chose Dark never sees a white page flash first, and somebody who has
      chosen nothing gets Retro rather than a flash of it. It reads a mirror of the
      preference the account holds; the application replaces it with whatever
      the server says a moment later. Deliberately tiny, dependency-free and
      wrapped in try/catch, because it sits in front of everything: if storage
      is unavailable this must fall through to the default, not stop the page.
    -->
    <script>
      (function () {
        try {
          var THEMES = [
            'default',
            'formal',
            'zen',
            'ladies',
            'retro',
            'techno',
            'blush',
            'azure',
            'leather',
            'light',
            'dark',
          ];
          var stored = window.localStorage.getItem('chat.theme');
          /*
           * Retro when nothing has been chosen, matching DEFAULT_PREFERENCES.
           * These two are the same decision written in two places — this one
           * runs before any JavaScript module loads — and if they disagree the
           * first paint is one theme and the second is another.
           */
          var theme = THEMES.indexOf(stored) >= 0 ? stored : 'retro';
          var root = document.documentElement;
          root.dataset.theme = theme;
          if (theme === 'default') {
            root.dataset.palette = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          } else if (theme === 'light' || theme === 'dark') {
            root.dataset.palette = theme;
          }
        } catch (error) {
          /* No theme is a working application; a thrown error here is not. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
